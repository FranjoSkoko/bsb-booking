<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moja rezervacija · Barbara Skoko Beauty</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/logo/favicon_32.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="action-page">
  <main class="action-card" id="card">
    <img src="/assets/logo/BSB_Znak_u_krugu_tamni.svg" alt="" width="72" height="72">
    <p class="empty">Učitavanje…</p>
  </main>
  <script type="module">
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const token = decodeURIComponent(location.pathname.split('/').pop());
    const card = document.getElementById('card');
    const logo = '<img src="/assets/logo/BSB_Znak_u_krugu_tamni.svg" alt="" width="72" height="72">';

    async function load() {
      const res = await fetch(`/api/bookings/${encodeURIComponent(token)}`);
      const b = await res.json();
      if (!res.ok) { card.innerHTML = `${logo}<h1>Rezervacija nije pronađena</h1><p><a class="btn" href="/#rezervacija">Rezervirajte termin</a></p>`; return; }
      render(b);
    }

    function render(b, message = '') {
      const active = ['na_cekanju', 'potvrdeno'].includes(b.status);
      card.innerHTML = `${logo}
        <p class="label">Moja rezervacija</p>
        <h1>${esc(b.name.split(' ')[0])}, <em>vaš termin</em></h1>
        <p class="status-pill st-${b.status}">${esc(b.status_label)}</p>
        <div class="action-info">
          <div style="font-family:var(--serif);font-size:22px">${esc(b.services.map((s) => s.name).join(' + '))}</div>
          <div>${esc(b.date_label)}</div>
          <div>${b.time} – ${b.end} · ${b.duration} min</div>
          <div>${Number(b.total_price).toLocaleString('hr-HR')} KM · plaćanje u salonu</div>
        </div>
        ${message ? `<p>${esc(message)}</p>` : ''}
        ${b.status === 'na_cekanju' ? '<p class="notice">Barbara će vam potvrditi termin emailom.</p>' : ''}
        ${active ? `<p><a class="btn btn-outline" href="/api/bookings/${encodeURIComponent(token)}/ics">Dodaj u kalendar</a></p>` : ''}
        ${b.can_cancel ? '<p><button class="btn-link" id="cancel">Otkaži termin</button></p>'
          : active ? `<p class="notice">Termin se putem linka može otkazati najkasnije ${b.cancel_hours} h prije. Za promjene se javite na +387 63 674 074.</p>` : ''}
        ${!active ? '<p><a class="btn" href="/#rezervacija">Rezervirajte novi termin</a></p>' : ''}
        <p><a href="/">Barbara Skoko Beauty</a></p>
        <p class="error" id="err" hidden></p>`;
      const c = document.getElementById('cancel');
      if (c) c.addEventListener('click', async () => {
        if (!confirm('Želite li sigurno otkazati termin?')) return;
        c.disabled = true;
        const res = await fetch(`/api/bookings/${encodeURIComponent(token)}/cancel`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) { const e = document.getElementById('err'); e.textContent = data.error; e.hidden = false; c.disabled = false; return; }
        render(data, 'Termin je otkazan. Poslali smo vam potvrdu emailom.');
      });
    }
    load();
  </script>
</body>
</html>
